<!doctype html><html lang="he" dir="rtl"><head>
<!-- PDF CACHE BUSTING: the ?v= is the first 8 hex of the PDF's sha256. Without it a returning
     visitor keeps the file their browser cached forever — a corrected CONTRACT would never reach
     them, which is how the statutory-typography fix looked "not deployed" on 2026-08-25 when it had
     in fact been live for an hour. Bump it whenever the PDF changes. -->
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>תנאי שירות, ביטול ופרטיות | סוכן הטיול הגדול</title>
<meta name="description" content="תנאי השירות, מדיניות הביטול וההחזרים ומדיניות הפרטיות של סומך טורס.">
<link rel="canonical" href="https://somechtours.com/terms/">
<link rel="icon" href="/brand/logo.png">
<link rel="preload" href="/brand/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/brand/fonts/heebo-latin.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* Heebo (OFL) self-hosted: one variable file per script, no third-party round trips before first paint */
@font-face{font-family:'Heebo';font-style:normal;font-weight:100 900;font-display:swap;src:url(/brand/fonts/heebo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Heebo';font-style:normal;font-weight:100 900;font-display:swap;src:url(/brand/fonts/heebo-hebrew.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
:root{--paper:#fff;--ink:#141414;--soft:#5a5a5a;--faint:#8a8a8a;--line:#e6e6e6}
@media(prefers-color-scheme:dark){:root{--paper:#0d0d0d;--ink:#f2f2f2;--soft:#b0b0b0;--faint:#7d7d7d;--line:#242424}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);direction:rtl;
  font-family:"Heebo",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  display:flex;flex-direction:column}
.bar{display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:12px 18px;border-bottom:1px solid var(--line);flex:0 0 auto}
/* a drawn chevron, not the "→" glyph: that character is in neither woff2, so it fell back to a
   system font in the middle of a Heebo line */
.bar .back::before{content:"";display:inline-block;width:7px;height:7px;margin-inline-end:8px;vertical-align:1px;
  border-top:1.5px solid currentColor;border-right:1.5px solid currentColor;transform:rotate(45deg)}
.bar a{color:var(--soft);text-decoration:none;font-size:13.5px;text-underline-offset:3px}
.bar a:hover{color:var(--ink);text-decoration:underline}
.bar strong{font-size:14.5px;font-weight:700}
.doc{flex:1 1 auto;border:0;width:100%;min-height:0}
/* A phone cannot reliably render an embedded PDF, so it gets a real link instead of a blank frame. */
.fallback{display:none;padding:34px 22px;text-align:center;line-height:1.8}
.fallback p{color:var(--soft);margin:0 0 20px;font-size:16px}
.btn{display:inline-block;padding:14px 28px;border-radius:999px;background:var(--ink);color:var(--paper);
  text-decoration:none;font-weight:700;font-size:16.5px}
@media(max-width:820px),(hover:none){.doc{display:none}.fallback{display:block}}
</style></head><body>
<div class="bar">
  <a class="back" href="/">חזרה לעמוד הראשי</a>
  <strong>תנאי שירות, ביטול ופרטיות</strong>
  <a href="/terms/somech-tours-terms.pdf?v=ec5ef9f5" download>הורדה</a>
</div>
<iframe class="doc" data-src="/terms/somech-tours-terms.pdf?v=ec5ef9f5#view=FitH" title="תנאי שירות, ביטול ופרטיות"></iframe>
<div class="fallback">
  <p>המסמך המלא של תנאי השירות, מדיניות הביטול וההחזרים ומדיניות הפרטיות.</p>
  <a class="btn" href="/terms/somech-tours-terms.pdf?v=ec5ef9f5">פתיחת המסמך</a>
</div>
<script>
// A phone hides the frame in CSS but would still download the 112KB PDF behind it, so the source is
// only attached where the frame is actually shown; the button below is the phone's path to the
// document. The query MATCHES THE STYLESHEET's, and it is re-checked on resize, so a window that
// grows past the breakpoint gets the frame filled in rather than left blank.
(() => {
  const f = document.querySelector(".doc");
  if (!f) return;
  const phone = matchMedia("(max-width:820px),(hover:none)");
  const sync = () => { if (!phone.matches && !f.src) f.src = f.dataset.src; };
  sync();
  if (phone.addEventListener) phone.addEventListener("change", sync);
  addEventListener("resize", sync);
})();
</script>
</body></html>
