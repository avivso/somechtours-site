<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>המסע — סוכן הטיול הגדול</title>
<meta name="description" content="מבנגקוק ועד האי. הזמנת כרטיסי אוטובוס, רכבת ומעבורת בוואטסאפ.">
<link rel="icon" href="/brand/logo.png">
<link rel="preload" href="/brand/fonts/heebo-hebrew.woff2" as="font" type="font/woff2" crossorigin>

<style>
/* Heebo (OFL) self-hosted: one variable file per script, no third-party round trips before first paint */
@font-face{font-family:'Heebo';font-style:normal;font-weight:100 900;font-display:swap;src:url(/brand/fonts/heebo-hebrew.woff2) format('woff2');unicode-range:U+0307-0308,U+0590-05FF,U+200C-2010,U+20AA,U+25CC,U+FB1D-FB4F}
@font-face{font-family:'Heebo';font-style:normal;font-weight:100 900;font-display:swap;src:url(/brand/fonts/heebo-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#f2f2f2;--bg:#0a0a0a;--wa:#25D366}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);direction:rtl;
  font-family:"Heebo",system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
/* the scroll track: its height IS the movie's length */
#track{position:relative}
#stage{position:sticky;top:0;height:100svh;overflow:hidden}
#film{position:absolute;inset:0;width:100%;height:100%;display:block}
/* darkening for legibility of overlays */
#stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.46));pointer-events:none;z-index:1}
.beat{z-index:2}
/* text beats */
.beat{position:absolute;inset:0;display:grid;place-items:center;text-align:center;
  opacity:0;pointer-events:none;padding:0 24px}
.beat h2{font-size:clamp(30px,6.5vw,58px);font-weight:900;margin:0;line-height:1.25;
  text-shadow:0 2px 24px rgba(0,0,0,.75), 0 0 4px rgba(0,0,0,.6);text-wrap:balance}
/* finale: logo, one line, the button. A soft dark pool behind the card keeps white type readable
   over the pale sky and sea of the last frames without a visible box. */
#finale > div{position:relative;padding:28px 34px 26px}
#finale > div::before{content:"";position:absolute;inset:-24px -50px;border-radius:50%;
  background:radial-gradient(ellipse at center,rgba(0,0,0,.42) 0%,rgba(0,0,0,.24) 45%,transparent 72%);z-index:-1}
.beat .logo{width:min(300px,68vw);display:block;margin:0 auto;
  /* true-alpha white artwork. A thin halo hugging the hiker and the letters, plus a soft dark
     shadow just behind them, so they read over any background without a big white bloom. */
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.85)) drop-shadow(0 1px 2px rgba(0,0,0,.6)) drop-shadow(0 3px 10px rgba(0,0,0,.45))}
.pitch{font-size:clamp(16px,2.4vw,20px);line-height:1.55;margin:14px auto 0;max-width:24em;
  text-shadow:0 1px 3px rgba(0,0,0,.7), 0 1px 14px rgba(0,0,0,.6);text-wrap:balance}
.cta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:16px 34px;border-radius:999px;
  background:var(--wa);color:#fff;text-decoration:none;font-size:18px;font-weight:700;
  box-shadow:0 4px 24px rgba(37,211,102,.45)}
.cta svg{width:22px;height:22px}
/* loader */
#loader{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:10;
  transition:opacity .5s ease}
#loader.done{opacity:0;pointer-events:none}
#loader .box{text-align:center}
#loader img{width:min(240px,60vw);filter:drop-shadow(0 0 1.5px rgba(255,255,255,.7))}
#bar{width:min(240px,60vw);height:2px;background:#2a2a2a;margin:26px auto 0;overflow:hidden}
#fill{height:100%;width:0%;background:var(--ink);transition:width .2s ease}
#hint{margin-top:16px;font-size:13px;color:#8a8a8a}
/* scroll nudge */
#nudge{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:5;
  font-size:13px;color:#eee;opacity:0;transition:opacity .6s ease;pointer-events:none;
  text-shadow:0 1px 8px rgba(0,0,0,.9)}
#nudge.show{opacity:.9}
#nudge .chev{display:block;margin:6px auto 0;width:16px;height:16px;border-inline-start:2px solid #eee;border-block-end:2px solid #eee;transform:rotate(-45deg);animation:dip 1.6s ease-in-out infinite}
@keyframes dip{0%,100%{translate:0 0;opacity:.9}50%{translate:0 7px;opacity:.4}}
@media(prefers-reduced-motion:reduce){
  #nudge .chev{animation:none}
}
</style></head><body>
<div id="loader"><div class="box">
  <img src="/brand/logo-white.png" alt="סוכן הטיול הגדול">
  <div id="bar"><div id="fill"></div></div>
  <div id="hint">טוענים את המסע...</div>
</div></div>

<div id="track">
  <div id="stage">
    <canvas id="film"></canvas>
    <section class="beat" data-from="0.03" data-to="0.21">
      <div><h2>מבנגקוק ועד האי הכי רחוק</h2></div>
    </section>
    <section class="beat" data-from="0.30" data-to="0.46">
      <div><h2>אוטובוסים</h2></div>
    </section>
    <section class="beat" data-from="0.55" data-to="0.71">
      <div><h2>רכבות</h2></div>
    </section>
    <section class="beat" data-from="0.78" data-to="0.88">
      <div><h2>מעבורות</h2></div>
    </section>
    <section class="beat" id="finale" data-from="0.905" data-to="1">
      <div>
        <img class="logo" src="/brand/logo-white.png" alt="סוכן הטיול הגדול">
        <p class="pitch">כותבים לאן ומתי, מקבלים אפשרויות ומחיר סופי, והכרטיס מגיע ישירות לוואטסאפ.</p>
        <div><a class="cta" href="https://wa.me/972559171333" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.86 9.86 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.5 2 12.04 2Zm5.8 14.13c-.24.68-1.2 1.25-1.96 1.41-.52.11-1.2.2-3.5-.75-2.94-1.22-4.83-4.2-4.98-4.4-.14-.19-1.18-1.57-1.18-3s.75-2.13 1.02-2.42c.27-.29.58-.36.78-.36.19 0 .39 0 .56.01.18.01.42-.7.8.61.39.7 1.33 2.44 1.45 2.61.12.18.2.39.04.62-.15.24-.23.38-.45.59-.22.2-.36.36-.52.58-.15.2-.31.42-.13.73.18.31.8 1.32 1.72 2.14 1.18 1.05 2.17 1.38 2.48 1.53.31.15.49.13.67-.08.18-.2.77-.9.98-1.21.2-.31.41-.26.68-.15.28.1 1.76.83 2.06.98.31.15.51.22.58.35.08.12.08.7-.16 1.38Z"/></svg>
          דברו איתנו בוואטסאפ
        </a></div>
      </div>
    </section>
  </div>
</div>
<div id="nudge">גללו למטה<span class="chev"></span></div>

<script>
(() => {
"use strict";
/* ====== CONFIG (filled by the build) ====== */
const FRAME_COUNT = 768;            // 4 scenes x 192 frames, one flat sequence
const BUILD = "v3";                 // bump with every frame rebuild: it keys the on-device cache
const pad = n => String(n + 1).padStart(4, "0");
// A phone is a portrait window; a 16:9 frame stretched to cover it is a 2.4x blow-up of a middle
// strip, which read as "bad quality" on a real device. So portrait viewports get frames cut from
// the master at FULL source height, with a per-frame pan that keeps the bus, train and ferry
// centred (they drift across the wide frame). Landscape gets 1600x900. Chosen once at load: a
// mid-session orientation flip would need both sets, and that is not a price a phone should pay.
const PORTRAIT = matchMedia("(orientation: portrait)").matches;
const SET = PORTRAIT ? "p" : "l";
// Every frame exists twice: AVIF (about a third fewer bytes at equal-or-better quality) and WebP.
// The first frame is tried as AVIF; if this browser cannot decode it, the whole film is WebP.
let FMT = "avif";
const src = i => `frames/${SET}/f${pad(i)}.${FMT}?${BUILD}`;
const PX_PER_FRAME = 9;             // 768 frames; total travel ~6900px + one viewport
const POOL = 16;                    // concurrent fetches: the CDN is ~100ms away, so this is the throughput knob
/* ========================================== */

const canvas = document.getElementById("film");
const ctx = canvas.getContext("2d");
const track = document.getElementById("track");
const loader = document.getElementById("loader");
const fill = document.getElementById("fill");
const nudge = document.getElementById("nudge");
const beats = [...document.querySelectorAll(".beat")].map(el => ({
  el, from: +el.dataset.from, to: +el.dataset.to
}));
const finale = document.getElementById("finale");

const frames = new Array(FRAME_COUNT).fill(null);
let loaded = 0, started = false, current = -1;

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

function sizeCanvas() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.round(innerWidth * dpr);
  canvas.height = Math.round(canvas.getBoundingClientRect().height * dpr);
  current = -1; // force redraw
}
function sizeTrack() {
  track.style.height = reduced ? "100svh" : `${FRAME_COUNT * PX_PER_FRAME + innerHeight}px`;
}

function draw(i) {
  const img = frames[i] || frames.slice(0, i).reverse().find(Boolean) || frames.find(Boolean);
  if (!img) return;
  const cw = canvas.width, ch = canvas.height;
  const iw = img.width, ih = img.height;
  const s = Math.max(cw / iw, ch / ih);
  const w = iw * s, h = ih * s;
  ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
}

function fraction() {
  const max = track.offsetHeight - innerHeight;
  return max > 0 ? Math.min(1, Math.max(0, scrollY / max)) : 1;
}

let dirty = true;
addEventListener("scroll", () => { dirty = true; }, { passive: true });
addEventListener("resize", () => { sizeCanvas(); sizeTrack(); dirty = true; });

function tick() {
  if (dirty) {
    dirty = false;
    const f = reduced ? 1 : fraction();
    const idx = Math.min(FRAME_COUNT - 1, Math.round(f * (FRAME_COUNT - 1)));
    if (idx !== current) { current = idx; draw(idx); }
    for (const b of beats) {
      const span = b.to - b.from;
      const p = (f - b.from) / span;
      let o = 0;
      if (p > 0 && p < 1) o = Math.min(1, Math.min(p, 1 - p) / 0.25);
      if (b.el === finale && f >= b.to - 0.02) o = 1; // the ending holds
      b.el.style.opacity = o.toFixed(3);
      b.el.style.pointerEvents = (b.el === finale && o > 0.5) ? "auto" : "none";
    }
    nudge.classList.toggle("show", started && f < 0.02 && !reduced);
  }
  requestAnimationFrame(tick);
}

function start() {
  if (started) return;
  started = true;
  loader.classList.add("done");
  sizeCanvas(); sizeTrack(); dirty = true;
  requestAnimationFrame(tick);
}

// ---- on-device frame store -------------------------------------------------------------------
// The CDN answers with a 10-minute max-age, so a second visit would re-validate 768 frames one
// round trip each. The Cache API keeps the frames on the device across visits, keyed by BUILD;
// any other build's store is dropped so a rebuild never shows stale frames.
const STORE = `journey-${BUILD}`;
const storeP = ("caches" in window)
  ? caches.open(STORE).catch(() => null)
  : Promise.resolve(null);
if ("caches" in window) {
  caches.keys().then(ks => ks.forEach(k => { if (k.startsWith("journey-") && k !== STORE) caches.delete(k); })).catch(() => {});
}
async function fetchFrame(url) {
  const store = await storeP;
  if (store) {
    const hit = await store.match(url).catch(() => null);
    if (hit) return hit;
  }
  const r = await fetch(url);
  if (!r.ok) throw new Error(r.status);
  if (store) store.put(url, r.clone()).catch(() => {});
  return r;
}

function onFrame(i, img) {
  frames[i] = img;
  loaded++;
  fill.style.width = `${Math.round(100 * loaded / FRAME_COUNT)}%`;
  if (started && i === current) { draw(i); }
}

function decode(url) {
  return fetchFrame(url)
    .then(r => r.blob())
    .then(b => ("createImageBitmap" in window) ? createImageBitmap(b) : new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im); im.onerror = rej;
      im.src = URL.createObjectURL(b);
    }));
}
function load(i) {
  return decode(src(i))
    .then(img => onFrame(i, img))
    .catch(() => { loaded++; }); // a missing frame must not wedge the loader
}

// ---- load order --------------------------------------------------------------------------------
// 1) a coarse skeleton of the whole film (every 64th, 32nd, 16th frame: 48 frames) so scrubbing
//    anywhere always finds a nearby frame, and the page can start on it;
// 2) then a wavefront: whichever un-fetched frame is nearest AHEAD of the playhead, so what the
//    visitor is about to see is what arrives next, wherever they are.
const requested = new Uint8Array(FRAME_COUNT);
const skeleton = [];
for (let step = 64; step >= 16; step = step >> 1) {
  for (let i = 0; i < FRAME_COUNT; i += step) if (!skeleton.includes(i)) skeleton.push(i);
}
const SKELETON = skeleton.length;
let skelCursor = 0, done = 0;
function pickNext() {
  while (skelCursor < skeleton.length) { const i = skeleton[skelCursor++]; if (!requested[i]) return i; }
  const c = Math.max(0, current);
  for (let k = 0; k < FRAME_COUNT; k++) { const i = (c + k) % FRAME_COUNT; if (!requested[i]) return i; }
  return -1;
}
// The format probe IS the first frame: decode f0001 as AVIF; if that fails, switch to WebP
// (frame 0 then simply joins the queue as WebP). One real decode, no synthetic test image.
function probe() {
  requested[0] = 1;
  return decode(src(0))
    .then(img => onFrame(0, img))
    .catch(() => { FMT = "webp"; requested[0] = 0; });
}
if (reduced) {
  probe().then(() => load(FRAME_COUNT - 1)).then(start);
} else {
  const next = () => {
    const i = pickNext();
    if (i < 0) return;
    requested[i] = 1;
    load(i).then(() => {
      done++;
      // start as soon as the skeleton is in; the rest streams while the visitor reads the opening
      if (!started && done >= SKELETON) start();
      next();
    });
  };
  probe().then(() => { done = requested[0]; for (let k = 0; k < POOL; k++) next(); });
  // absolute fallback: never trap a visitor on the loader
  setTimeout(start, 12000);
}
})();
</script>
</body></html>
