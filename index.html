// continuous motion at 60fps out of coarse input, and it also caps how fast the playhead can travel,
// which is what lets the decode window stay ahead of it. TAU is the time constant, so the response
// is identical on a 60Hz and a 120Hz screen.
function tick(ts) {
  const dt = prevTs ? Math.min(64, ts - prevTs) : 16;   // clamped so a backgrounded tab cannot jump
  prevTs = ts;
  const t = (reduced ? 1 : fraction()) * (FRAME_COUNT - 1);
  if (t !== target) {
    if (Math.abs(t - target) > 0.5) dir = t > target ? 1 : -1;  // deadband: jitter must not flip the window
    target = t;
  }
  if (shown < 0) shown = target;                        // first paint lands exactly, with no slide-in
  if (shown !== target) {
    const gap = target - shown;
    shown = Math.abs(gap) < 0.02 ? target : shown + gap * (1 - Math.exp(-dt / TAU));
    dirty = true;
  }
  if (dirty) {
    dirty = false;
    const f = shown / (FRAME_COUNT - 1);
    const idx = Math.min(FRAME_COUNT - 1, Math.max(0, Math.round(shown)));
    // redraw on every dirty tick, not only on a move: a frame that finishes decoding while the
    // playhead sits still must replace the stand-in that draw() picked earlier
    const moved = idx !== current;
    current = idx;
    draw(idx);
    if (moved) refreshWindow();
    for (const b of beats) {
      const span = b.to - b.from;
      const p = (f - b.from) / span;
      let o = 0;
      if (p > 0 && p < 1) o = Math.min(1, Math.min(p, 1 - p) / 0.25);
      if (b.el === finale && p >= 0.75) o = 1; // the ending holds once fully in
      b.el.style.opacity = o.toFixed(3);
      b.el.style.pointerEvents = (b.el === finale && o > 0.5) ? "auto" : "none";
    }
    nudge.classList.toggle("show", started && f < 0.02 && !reduced);
  }
  requestAnimationFrame(tick);
}

function start() {
  if (started) return;
  // the set was picked before layout; if the real viewport disagrees, reload once (guarded so it
  // can never loop) and the correct set comes straight out of the on-device store. Reading the
  // guard throws outright when storage is blocked, so the whole check sits inside the try.
  try {
    if (innerWidth > 0 && innerHeight > 0 && (innerHeight >= innerWidth) !== PORTRAIT && !sessionStorage.getItem("j-set-fixed")) {
      sessionStorage.setItem("j-set-fixed", "1"); location.reload(); return;
    }
  } catch (e) {}
  started = true;
  loader.classList.add("done");
  sizeCanvas(); sizeTrack(); dirty = true;
  requestAnimationFrame(tick);
}

// ---- decode window ---------------------------------------------------------------------------
function wanted(i) {
  if (i % COARSE === 0) return true;
  if (current < 0) return i <= AHEAD;
  const d = (i - current) * dir;   // > 0 means ahead of the playhead in the direction of travel
  return d <= AHEAD && d >= -BEHIND;
}
function decodeBlob(b) {
  return ("createImageBitmap" in window) ? createImageBitmap(b) : new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = rej;
    im.src = URL.createObjectURL(b);
  });
}
let decodersBusy = 0;
function pickDecode() {
  const c = Math.max(0, current);
  const free = (i) => i >= 0 && i < FRAME_COUNT && blobs[i] && !bitmaps[i] && !decoding[i];
  for (let d = 0; d <= AHEAD; d++) {               // nearest first, and ahead means ahead of TRAVEL
    const a = c + d * dir, b = c - d * dir;
    if (free(a)) return a;
    if (d <= BEHIND && free(b)) return b;
  }
  for (let i = 0; i < FRAME_COUNT; i += COARSE) if (blobs[i] && !bitmaps[i] && !decoding[i]) return i;
  return -1;
}
function scheduleDecodes() {
  while (decodersBusy < DECODERS) {
    const i = pickDecode();
    if (i < 0) return;
    decoding[i] = 1; decodersBusy++;
    decodeBlob(blobs[i]).then(bm => {
      if (wanted(i)) { bitmaps[i] = bm; decoded.add(i); dirty = true; }
      else if (bm.close) bm.close();
      // start() runs OUTSIDE this chain: a throw inside it must not be read as "frame undecodable"
      if (!started && fetched >= SKELETON && bitmaps[0]) queueMicrotask(start);
    }).catch(() => {
      // An undecodable frame. The probe already proved this browser can decode the format, so this
      // is a corrupt frame, not a missing capability: re-fetch THIS frame as WebP and leave the rest
      // of the film alone. A second failure leaves it a hole rather than looping fetch-decode-fail.
      if (decodeFails[i]++ < 1) { fmtForce[i] = "webp"; dropFrame(i); kick(); }
      else blobs[i] = null;
    }).finally(() => { decoding[i] = 0; decodersBusy--; scheduleDecodes(); });
  }
}
function refreshWindow() {
  for (const i of decoded) {
    if (!wanted(i)) { const bm = bitmaps[i]; bitmaps[i] = null; decoded.delete(i); if (bm && bm.close) bm.close(); }
  }
  scheduleDecodes();
  kick(); // the playhead moved: restart the pool if it had drained, so it fetches around the new position
}

// ---- on-device frame store -------------------------------------------------------------------
// The CDN answers with a 10-minute max-age, so a second visit would re-validate 768 frames one
// round trip each. The Cache API keeps the frames on the device across visits, keyed by BUILD;
// any other build's store is dropped so a rebuild never shows stale frames.
const STORE = `journey-${BUILD}`;
const storeP = ("caches" in window)
  ? caches.open(STORE).catch(() => null)
  : Promise.resolve(null);
if ("caches" in window) {
  caches.keys().then(ks => ks.forEach(k => { if (k.startsWith("journey-") && k !== STORE) caches.delete(k); })).catch(() => {});
}
async function fetchFrame(url) {
  const store = await storeP;
  if (store) {
    const hit = await store.match(url).catch(() => null);
    if (hit) return hit;
  }
  const opts = ("AbortSignal" in window && AbortSignal.timeout) ? { signal: AbortSignal.timeout(20000) } : {};
  const r = await fetch(url, opts);
  if (!r.ok) { const e = new Error(String(r.status)); e.status = r.status; throw e; }
  if (store) store.put(url, r.clone()).catch(() => {});
  return r;
}
// one frame's bytes: up to three tries; a missing/undecodable AVIF falls back to WebP for that frame
async function getBlob(i) {
  let fmt = fmtForce[i] || FMT, lastErr = null;
  for (let attempt = 0; attempt < 3; attempt++) {
    if (FMT === "webp" || fmtForce[i] === "webp") fmt = "webp";
    try {
      const r = await fetchFrame(urlOf(i, fmt));
      const b = await r.blob();
      return { b, fmt };
    } catch (e) {
      lastErr = e;
      if (fmt === "avif" && e && e.status === 404) { fmt = "webp"; fmtForce[i] = "webp"; continue; }
      await new Promise(res => setTimeout(res, 300 * (attempt + 1)));
    }
  }
  throw lastErr || new Error("frame " + i);
}

function onBlob(i, b, fmt) {
  blobs[i] = b; fmtOf[i] = fmt;
  fetched++;
  fill.style.width = `${Math.min(100, Math.round(100 * fetched / SKELETON))}%`;
  if (wanted(i)) scheduleDecodes();
}
function dropFrame(i) { // forget a fetched frame so the pool fetches it again
  if (blobs[i]) fetched--;
  blobs[i] = null; fmtOf[i] = null; requested[i] = 0;
}
// Only the probe calls this: the browser cannot decode AVIF at all. It does NOT start the pool,
// because a reduced-motion visitor wants exactly one frame, not the whole film.
function flipToWebp() {
  if (FMT === "webp") return;
  FMT = "webp";
  // frames fetched as AVIF but not yet decoded are useless now: fetch them again as WebP
  for (let i = 0; i < FRAME_COUNT; i++) {
    if (blobs[i] && fmtOf[i] === "avif" && !bitmaps[i] && !decoding[i]) dropFrame(i);
  }
}

// ---- load order --------------------------------------------------------------------------------
// 1) a coarse skeleton of the whole film (every 64th, 32nd, 16th frame: 48 frames) so scrubbing
//    anywhere always finds a nearby frame, and the page can start on it;
// 2) then a wavefront out from the playhead, two frames ahead for every one behind, so what the
//    visitor is about to see is what arrives next, wherever they are.
const requested = new Uint8Array(FRAME_COUNT);
const skeleton = [];
for (let step = 64; step >= 16; step = step >> 1) {
  for (let i = 0; i < FRAME_COUNT; i += step) if (!skeleton.includes(i)) skeleton.push(i);
}
const SKELETON = skeleton.length;
let skelCursor = 0, active = 0, retryTimer = 0;
const failed = [];
function pickNext() {
  while (skelCursor < skeleton.length) { const i = skeleton[skelCursor++]; if (!requested[i]) return i; }
  const c = Math.max(0, current);
  for (let d = 0; d < FRAME_COUNT; d++) {
    const a = c + d, b = c - ((d + 1) >> 1);
    if (a < FRAME_COUNT && !requested[a]) return a;
    if (b >= 0 && !requested[b]) return b;
  }
  // The wavefront above only reaches back to current-384, so a visitor who jumped to the end would
  // strand everything before it. Whatever it missed is picked up here, in plain order.
  for (let i = 0; i < FRAME_COUNT; i++) if (!requested[i]) return i;
  return -1;
}
// One in-flight fetch. Claims the next frame BEFORE occupying a slot, so an empty queue ends the
// loop instead of re-entering it (a while that only tested `active` spun forever and froze the tab).
function slot() {
  const i = pickNext();
  if (i < 0) {
    active--;
    // frames that failed all their tries get one more round later (a phone that lost signal for a moment)
    if (failed.length && !retryTimer) retryTimer = setTimeout(() => { retryTimer = 0; while (failed.length) requested[failed.pop()] = 0; kick(); }, 4000);
    return false;
  }
  requested[i] = 1;
  getBlob(i).then(({ b, fmt }) => onBlob(i, b, fmt)).catch(() => { failed.push(i); }).then(slot);
  return true;
}
function kick() { while (active < POOL) { active++; if (!slot()) break; } }

// The format probe IS the first frame: decode f0001 as AVIF; if that fails, the film is WebP.
// The pool does not wait for it: the few frames fetched as AVIF meanwhile are simply re-fetched.
function probe(i) {
  requested[i] = 1;
  return getBlob(i)
    .then(({ b, fmt }) => decodeBlob(b).then(bm => { bitmaps[i] = bm; decoded.add(i); onBlob(i, b, fmt); dirty = true; })
      .catch(() => { if (fmt === "avif") { requested[i] = 0; flipToWebp(); } }))
    .catch(() => { requested[i] = 0; });
}
if (reduced) {
  // exactly one frame, and one retry of it if the format flipped underneath us
  probe(FRAME_COUNT - 1)
    .then(() => bitmaps[FRAME_COUNT - 1] ? null : probe(FRAME_COUNT - 1))
    .then(start);
  setTimeout(start, 12000);
} else {
  probe(0).then(() => { kick(); if (!started && fetched >= SKELETON && bitmaps[0]) start(); });
  kick();
  // absolute fallback: never trap a visitor on the loader
  setTimeout(start, 12000);
}

// a rotation needs the other frame set; the frames are on the device, so a reload is the cheap way
const orient = matchMedia("(orientation: portrait)");
let orientTimer = 0;
const onOrient = () => {
  clearTimeout(orientTimer);
  orientTimer = setTimeout(() => { if (started && orient.matches !== PORTRAIT) location.reload(); }, 500);
};
if (orient.addEventListener) orient.addEventListener("change", onOrient); else if (orient.addListener) orient.addListener(onOrient);
})();
</script>
